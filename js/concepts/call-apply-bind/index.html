<!--
    call, apply, and bind are methods to control the value of this inside a function.

    => call invokes the function immediately with arguments passed one by one.
    => apply invokes it immediately with arguments passed as an array.
    => bind returns a new function with this permanently bound, so it can be called later.

    In all 3 method types, this object is passed as the first argument
-->
